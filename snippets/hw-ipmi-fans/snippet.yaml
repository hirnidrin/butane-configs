# hw-ipmi-fans - pin IPMI fan speeds on Supermicro-style BMCs after every boot
#
# Optional vars: IPMI_FAN_CPU_DUTY, IPMI_FAN_PERIPHERAL_DUTY (see defaults.env)
#
# Harvested from the retired wucore-quader config. Unlike there, this runs on
# every boot and is not sequenced behind any flag file: the BMC forgets the
# manual fan mode across power cycles, so there is nothing to track.
#
# Needs `ipmitool` and the OpenIPMI modules: on Flatcar add the
# sysext-ipmitool snippet; on stock FCOS, layer ipmitool first.
#
# The script lives in /opt/bin: /usr is read-only on Flatcar, and /opt is
# writable on both Flatcar and FCOS.
storage:
  files:
    - path: /opt/bin/set-fanspeeds.sh
      mode: 0755
      contents:
        local: opt/bin/set-fanspeeds.sh
systemd:
  units:
    - name: fanspeed.service
      enabled: true
      contents_local: units/fanspeed.service
