# base-flatcar-updates - automatic Flatcar updates, reboots only in a weekly window
#
# Optional vars: UPDATE_REBOOT_WINDOW_START, UPDATE_REBOOT_WINDOW_LENGTH
#                (see defaults.env)
#
# update-engine downloads updates to the passive partition whenever they
# appear; locksmithd reboots into them only inside the window. A bad update
# is rolled back by booting the other partition.
storage:
  files:
    - path: /etc/flatcar/update.conf
      overwrite: true
      mode: 0644
      contents:
        inline: |
          GROUP=stable
          REBOOT_STRATEGY=reboot
          LOCKSMITHD_REBOOT_WINDOW_START="${UPDATE_REBOOT_WINDOW_START}"
          LOCKSMITHD_REBOOT_WINDOW_LENGTH=${UPDATE_REBOOT_WINDOW_LENGTH}
  links:
    # Flatcar enables systemd-sysupdate-reboot.timer in the image. With no
    # sysupdate-managed components it fails every night ("Couldn't find any
    # suitable installed versions") and can never reboot anything; reboots
    # are locksmithd's job, in the window above.
    - path: /etc/systemd/system/systemd-sysupdate-reboot.timer
      target: /dev/null
      hard: false
      overwrite: true
